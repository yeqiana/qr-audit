name: Python package checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Validate package
        run: python scripts/validate_skill_package.py
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Compile scripts
        run: python -m compileall -q scripts tests
  recognition-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install image-only test dependencies
        run: python -m pip install --disable-pip-version-check 'numpy>=2,<3' 'opencv-python-headless>=4.10,<6' 'qrcode[pil]>=8,<9' 'zxing-cpp>=2,<4'
      - name: Synthetic QR recognition regression
        run: |
          python -m unittest discover -s tests -p 'test_*boost.py' -v
          python -m unittest discover -s tests -p 'test_fallback_pipeline.py' -v
          python -m unittest discover -s tests -p 'test_geometry_recovery.py' -v
          python -m unittest discover -s tests -p 'test_ai_*py' -v
          python -m unittest discover -s tests -p 'test_module_recovery.py' -v
